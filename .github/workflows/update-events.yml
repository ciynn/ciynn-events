# Rebuild the website every Monday morning (fresh events and conferences) and publish site/ to GitHub Pages.
# It also rebuilds whenever something is pushed, e.g. a new news post or article.
# Can also be run by hand from the Actions tab ("Run workflow").
name: Build website

on:
  schedule:
    - cron: "0 6 * * 1"        # 06:00 UTC every Monday
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing is switched off until the repository is public and Pages is on: then add the
  # repository variable PUBLISH_PAGES = true (Settings > Secrets and variables > Actions > Variables).
  deploy:
    needs: build
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
